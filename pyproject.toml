[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "territory-optimisation-engine"
version = "0.1.0"
description = "Constraint-based territory planning engine for revenue operations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "numpy>=2.1,<3",
  "openpyxl>=3.1,<4",
  "ortools==9.15.6755",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
notebook = ["ipython>=8,<10", "plotly>=5,<7"]
test = ["ipython>=8,<10", "plotly>=5,<7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
